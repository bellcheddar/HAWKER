name: HAWKER
options:
  bundleIdPrefix: com.mdeller
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Never hard-coded: this repo is public. Comes from credentials.env.
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HAWKER
    CODE_SIGN_STYLE: Automatic

packages:
  HawkerKit:
    path: HawkerKit

targets:
  # ---------------------------------------------------------------- iOS / iPadOS
  HAWKER-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/HAWKER-iOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker
        PRODUCT_NAME: HAWKER
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
      configs:
        Release:
          # Per target, not project-wide: a project-level configs block is shadowed
          # by target settings and the archive silently signs Apple Development.
          CODE_SIGN_IDENTITY: Apple Distribution
    info:
      path: Apps/HAWKER-iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.mdeller.hawker
            CFBundleURLSchemes: [hawker]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  # ---------------------------------------------------------------------- macOS
  HAWKER-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/HAWKER-macOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker
        PRODUCT_NAME: HAWKER
        # Required by the Mac App Store: altool rejects the upload with 90242
        # after the whole binary has gone up, so it is set from the start.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: 2026 Marc C. Deller
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    entitlements:
      path: Config/HAWKER-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Apps/HAWKER-macOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.mdeller.hawker
            CFBundleURLSchemes: [hawker]

  # ------------------------------------------------------------------- visionOS
  HAWKER-visionOS:
    type: application
    platform: visionOS
    sources:
      - path: Apps/HAWKER-visionOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker
        PRODUCT_NAME: HAWKER
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    info:
      path: Apps/HAWKER-visionOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.mdeller.hawker
            CFBundleURLSchemes: [hawker]
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true

  # -------------------------------------------------------------------- watchOS
  HAWKER-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Apps/HAWKER-watchOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker.watchkitapp
        PRODUCT_NAME: HAWKER
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mdeller.hawker
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    info:
      path: Apps/HAWKER-watchOS/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mdeller.hawker

schemes:
  HAWKER-iOS:
    build:
      targets: { HAWKER-iOS: all }
    run:
      config: Debug
  HAWKER-macOS:
    build:
      targets: { HAWKER-macOS: all }
    run:
      config: Debug
  HAWKER-visionOS:
    build:
      targets: { HAWKER-visionOS: all }
    run:
      config: Debug
  HAWKER-watchOS:
    build:
      targets: { HAWKER-watchOS: all }
    run:
      config: Debug
