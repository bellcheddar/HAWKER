name: HAWKER
options:
  bundleIdPrefix: com.mdeller
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Never hard-coded: this repo is public. Comes from credentials.env.
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HAWKER
    # Debug signs automatically. Release is manual per target below: an automatic
    # style with a manually specified Apple Distribution identity is a hard conflict
    # ("HAWKER-iOS has conflicting provisioning settings"), and leaving it automatic
    # instead silently signs a Release archive with Apple Development.
    CODE_SIGN_STYLE: Automatic

packages:
  HawkerKit:
    path: HawkerKit

targets:
  # ---------------------------------------------------------------- iOS / iPadOS
  HAWKER-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/HAWKER-iOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
      # A companion watch app (one declaring WKCompanionAppBundleIdentifier) must ship
      # inside the iOS app's Watch/ directory. Built as an independent target it
      # archives cleanly and is simply absent from the submission.
      - target: HAWKER-watchOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker
        PRODUCT_NAME: HAWKER
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
      configs:
        Release:
          # Per target, not project-wide: a project-level configs block is shadowed
          # by target settings and the archive silently signs Apple Development.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: HAWKER App Store
    info:
      path: Apps/HAWKER-iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.mdeller.hawker
            CFBundleURLSchemes: [hawker]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  # ---------------------------------------------------------------------- macOS
  HAWKER-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/HAWKER-macOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker
        PRODUCT_NAME: HAWKER
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required by the Mac App Store: altool rejects the upload with 90242
        # after the whole binary has gone up, so it is set from the start.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: 2026 Marc C. Deller
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: HAWKER macOS App Store
    entitlements:
      path: Config/HAWKER-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Apps/HAWKER-macOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.mdeller.hawker
            CFBundleURLSchemes: [hawker]

  # ------------------------------------------------------------------- visionOS
  HAWKER-visionOS:
    type: application
    platform: visionOS
    sources:
      - path: Apps/HAWKER-visionOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker
        PRODUCT_NAME: HAWKER
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: HAWKER visionOS App Store
    info:
      path: Apps/HAWKER-visionOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.mdeller.hawker
            CFBundleURLSchemes: [hawker]
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true

  # -------------------------------------------------------------------- watchOS
  HAWKER-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Apps/HAWKER-watchOS
    dependencies:
      - package: HawkerKit
        product: HawkerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.hawker.watchkitapp
        PRODUCT_NAME: HAWKER
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mdeller.hawker
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: HAWKER watchOS App Store
    info:
      path: Apps/HAWKER-watchOS/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mdeller.hawker

schemes:
  HAWKER-iOS:
    build:
      targets: { HAWKER-iOS: all }
    run:
      config: Debug
  HAWKER-macOS:
    build:
      targets: { HAWKER-macOS: all }
    run:
      config: Debug
  HAWKER-visionOS:
    build:
      targets: { HAWKER-visionOS: all }
    run:
      config: Debug
  HAWKER-watchOS:
    build:
      targets: { HAWKER-watchOS: all }
    run:
      config: Debug
